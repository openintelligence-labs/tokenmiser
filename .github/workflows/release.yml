name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.5.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Windows: pingora pulls in unix-only deps (nix, daemonize), so the
    # msvc build is expected to fail until upstream supports Windows.
    # Keep it in the matrix so we notice the day it starts working.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          # On tag pushes inputs.tag is empty, so this falls back to the
          # pushed ref; on workflow_dispatch it checks out the release tag.
          ref: ${{ inputs.tag }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (linux aarch64 only)
        if: matrix.cross == true
        run: cargo install --locked cross

      - name: Build (cargo)
        if: matrix.cross != true
        run: cargo build --release --locked --target ${{ matrix.target }} -p tokenmiser

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }} -p tokenmiser

      - name: Stage assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="tokenmiser-${{ steps.tag.outputs.tag }}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/tokenmiser.exe" "dist/tokenmiser.exe"
            (cd dist && 7z a "${name}.zip" tokenmiser.exe)
          else
            cp "target/${{ matrix.target }}/release/tokenmiser" "dist/tokenmiser"
            (cd dist && tar -czf "${name}.tar.gz" tokenmiser)
          fi
          ls -la dist

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            # macOS runners ship shasum; Windows Git Bash + Linux ship sha256sum.
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" > "${f}.sha256"
            else
              sha256sum "$f" > "${f}.sha256"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenmiser-${{ matrix.target }}
          path: |
            dist/tokenmiser-*.tar.gz
            dist/tokenmiser-*.tar.gz.sha256
            dist/tokenmiser-*.zip
            dist/tokenmiser-*.zip.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        # NOTE: keep this out of ./dist and other repo directories so the
        # release glob below only ever matches CI-built assets.
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release-assets
        run: |
          set -euo pipefail
          find release-assets -mindepth 2 -type f -exec mv {} release-assets/ \;
          find release-assets -type d -empty -delete
          ls -la release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TokenMiser ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/*
